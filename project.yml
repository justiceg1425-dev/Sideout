name: Sideout
options:
  bundleIdPrefix: com.justiceg.sideout
  deploymentTarget:
    iOS: "17.0"
    # 8.0 is the practical floor: it's the first watchOS with the Swift
    # concurrency runtime (async/await, used throughout the watch app)
    # without back-deployment tricks, and it's what an Apple Watch
    # Series 3 tops out at (watchOS 9 dropped Series 3 entirely). Newer
    # watchOS-only APIs (Double Tap, HKWorkoutActivityType.pickleball)
    # are individually #available-gated rather than raising this.
    watchOS: "8.0"
  createIntermediateGroups: true

packages:
  SideoutEngine:
    path: Packages/SideoutEngine

targets:
  Sideout:
    type: application
    platform: iOS
    sources:
      - path: Sideout
      - path: Shared
    dependencies:
      - package: SideoutEngine
      - target: "Sideout Watch App"
        embed: true
    info:
      path: Sideout/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justiceg.sideout
        PRODUCT_NAME: Sideout
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P853UYQ9G8

  "Sideout Watch App":
    type: application
    platform: watchOS
    sources:
      - path: Sideout Watch App
      - path: Shared
    dependencies:
      - package: SideoutEngine
    info:
      path: Sideout Watch App/Info.plist
      properties:
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.justiceg.sideout
        NSHealthShareUsageDescription: "Sideout logs each game as a workout so you can see it in Health."
        NSHealthUpdateUsageDescription: "Sideout logs each game as a workout so you can see it in Health."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: "Sideout Watch App/SideoutWatchApp.entitlements"
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justiceg.sideout.watchkitapp
        PRODUCT_NAME: "Sideout Watch App"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.9"
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "8.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P853UYQ9G8
        # RETEST (Xcode 16.4): armv7k previously failed SideoutEngine SPM
        # resolution, but that was only ever tried under Xcode 26 -- an
        # older toolchain (16.4) hasn't been ruled out. If this build
        # fails the same way under 16.4, revert to the prior comment here
        # (see git history) and stop -- don't leave this half-reverted.
        ARCHS: "$(ARCHS_STANDARD) armv7k"
        VALID_ARCHS: "arm64_32 armv7k"
        ONLY_ACTIVE_ARCH: NO

schemes:
  Sideout:
    build:
      targets:
        Sideout: all
    run:
      config: Debug
  "Sideout Watch App":
    build:
      targets:
        "Sideout Watch App": all
    run:
      config: Debug
